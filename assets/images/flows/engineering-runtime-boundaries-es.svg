<text x="240" y="375" text-anchor="middle" fill="#e2b977" font-family="Arial, sans-serif" font-size="18" font-weight="600">LÍMITE DE ENTREGA</text>
<rect x="34" y="414" width="412" height="94" rx="16" fill="#1d3041" stroke="#8bbca7" stroke-width="2"/><text x="240" y="457" text-anchor="middle" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="22" font-weight="600">Aplicación → agente</text><text x="240" y="487" text-anchor="middle" fill="#c6d5de" font-family="Arial, sans-serif" font-size="17" font-weight="400">Identidad de servicio</text>
<path d="M240 508 V529 M232 521 L240 530 L248 521" fill="none" stroke="#80aeca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="34" y="539" width="412" height="100" rx="16" fill="#1d3041" stroke="#8bbca7" stroke-width="2"/><text x="240" y="585" text-anchor="middle" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="22" font-weight="600">Datos + herramientas de negocio</text><text x="240" y="615" text-anchor="middle" fill="#c6d5de" font-family="Arial, sans-serif" font-size="17" font-weight="400">Tenant · autorización · aprobación</text>
<text x="240" y="718" text-anchor="middle" fill="#e2b977" font-family="Arial, sans-serif" font-size="18" font-weight="600">Cada acción cruza un límite</text>
