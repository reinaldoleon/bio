<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" width="480" height="800" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Two tracks</title>
<desc id="diagram-desc">The relationship is conditional</desc>
<rect width="480" height="800" rx="24" fill="#122031"/>
<rect x="1" y="1" width="478" height="798" rx="23" fill="none" stroke="#304a5c" stroke-width="2"/>
<text x="240" y="48" text-anchor="middle" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="26" font-weight="600">Two tracks</text>
<text x="240" y="79" text-anchor="middle" fill="#a9c4d5" font-family="Arial, sans-serif" font-size="17" font-weight="400">The relationship is conditional</text>
<rect x="34" y="110" width="412" height="100" rx="16" fill="#1d3041" stroke="#80aeca" stroke-width="2"/><text x="240" y="156" text-anchor="middle" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="22" font-weight="600">AI-assisted engineering</text><text x="240" y="186" text-anchor="middle" fill="#c6d5de" font-family="Arial, sans-serif" font-size="17" font-weight="400">People + agents + CI</text>
<path d="M240 210 V242 M232 234 L240 243 L248 234" fill="none" stroke="#80aeca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="34" y="252" width="412" height="100" rx="16" fill="#1d3041" stroke="#80aeca" stroke-width="2"/><text x="240" y="298" text-anchor="middle" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="22" font-weight="600">Delivered software</text><text x="240" y="328" text-anchor="middle" fill="#c6d5de" font-family="Arial, sans-serif" font-size="17" font-weight="400">Conventional API or AI product</text>
<path d="M240 352 V384 M232 376 L240 385 L248 376" fill="none" stroke="#80aeca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="34" y="394" width="412" height="90" rx="16" fill="#1d3041" stroke="#e2b977" stroke-width="2"/><text x="240" y="447" text-anchor="middle" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="22" font-weight="600">Does it use AI at runtime?</text>
<rect x="34" y="510" width="201" height="80" rx="12" fill="#22394c" stroke="#466b80"/><text x="134" y="557" text-anchor="middle" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="18" font-weight="600">No → no inference</text><rect x="245" y="510" width="201" height="80" rx="12" fill="#22394c" stroke="#466b80"/><text x="345" y="557" text-anchor="middle" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="18" font-weight="600">Yes → AI controls</text>
<rect x="34" y="650" width="412" height="100" rx="16" fill="#1d3041" stroke="#8bbca7" stroke-width="2"/><text x="240" y="696" text-anchor="middle" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="22" font-weight="600">Shared capabilities</text><text x="240" y="726" text-anchor="middle" fill="#c6d5de" font-family="Arial, sans-serif" font-size="17" font-weight="400">Different policies and owners</text>
</svg>
