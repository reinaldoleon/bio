<path d="M240 298 V320 M232 312 L240 321 L248 312" fill="none" stroke="#80aeca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="34" y="330" width="412" height="79" rx="16" fill="#1d3041" stroke="#80aeca" stroke-width="2"/><text x="240" y="377" text-anchor="middle" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="22" font-weight="600">Implementation</text>
<path d="M240 409 V431 M232 423 L240 432 L248 423" fill="none" stroke="#80aeca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="34" y="441" width="412" height="91" rx="16" fill="#1d3041" stroke="#8bbca7" stroke-width="2"/><text x="240" y="494" text-anchor="middle" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="22" font-weight="600">Validation → evidence</text>
<path d="M240 532 V554 M232 546 L240 555 L248 546" fill="none" stroke="#80aeca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="34" y="564" width="412" height="79" rx="16" fill="#1d3041" stroke="#e2b977" stroke-width="2"/><text x="240" y="611" text-anchor="middle" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="22" font-weight="600">Human approval</text>
<path d="M240 643 V665 M232 657 L240 666 L248 657" fill="none" stroke="#80aeca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="34" y="675" width="412" height="79" rx="16" fill="#1d3041" stroke="#80aeca" stroke-width="2"/><text x="240" y="722" text-anchor="middle" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="22" font-weight="600">Operation</text>
</svg>
