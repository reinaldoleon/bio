<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">La automatización debe apoyar la evaluación, no sustituir el criterio</title>
  <desc id="desc">Comparación entre decidir con una puntuación de IA y usar evidencias, preguntas y entrevista para una decisión humana.</desc>
  <rect width="1254" height="1254" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="54" y="83" font-size="56" font-weight="700" fill="#102238">La automatización debe apoyar</text>
    <text x="54" y="151" font-size="56" font-weight="700" fill="#102238">la evaluación, no sustituir el criterio.</text>
    <rect x="32" y="208" width="574" height="908" rx="24" fill="#fbf0f0"/>
    <rect x="626" y="208" width="596" height="908" rx="24" fill="#edf6f9"/>
    <circle cx="85" cy="270" r="25" fill="#de6763"/>
    <path d="M75 260 L95 280 M95 260 L75 280" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <text x="126" y="277" font-size="36" font-weight="700" fill="#102238">Decisión delegada</text>
    <text x="64" y="325" font-size="24" fill="#425469">Una cifra sustituye la revisión.</text>
    <circle cx="679" cy="270" r="25" fill="#5f9e82"/>
    <path d="M668 270 L676 278 L692 260" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="720" y="277" font-size="36" font-weight="700" fill="#102238">Criterio informado</text>
    <text x="658" y="325" font-size="24" fill="#425469">La IA aporta señales y preguntas.</text>

    <g fill="white" stroke="#ead8d8" stroke-width="2">
      <rect x="64" y="398" width="510" height="145" rx="16"/>
      <rect x="64" y="650" width="510" height="145" rx="16"/>
      <rect x="64" y="902" width="510" height="145" rx="16"/>
    </g>
    <g fill="#102238" font-weight="700" font-size="31">
      <text x="95" y="458">Entrega técnica</text>
      <text x="95" y="710">Puntuación de IA</text>
      <text x="95" y="962">Aceptar o descartar</text>
    </g>
    <g fill="#526177" font-size="22">
      <text x="95" y="499">Diseño de solución y ADRs.</text>
      <text x="95" y="751">Una cifra sin contexto suficiente.</text>
      <text x="95" y="1003">Decisión basada solo en la cifra.</text>
    </g>
    <g fill="none" stroke="#8e9cae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M319 557 V629 M311 620 L319 630 L327 620"/>
      <path d="M319 809 V881 M311 872 L319 882 L327 872"/>
    </g>

    <g fill="white" stroke="#d3e3e9" stroke-width="2">
      <rect x="658" y="370" width="532" height="118" rx="15"/>
      <rect x="658" y="516" width="532" height="118" rx="15"/>
      <rect x="658" y="662" width="532" height="118" rx="15"/>
      <rect x="658" y="808" width="532" height="118" rx="15"/>
      <rect x="658" y="954" width="532" height="118" rx="15"/>
    </g>
    <g fill="#102238" font-size="28" font-weight="700">
      <text x="688" y="415">Entrega técnica</text>
      <text x="688" y="561">Análisis asistido</text>
      <text x="688" y="707">Evidencias y preguntas</text>
      <text x="688" y="853">Entrevista humana</text>
      <text x="688" y="999">Decisión humana</text>
    </g>
    <g fill="#526177" font-size="20">
      <text x="688" y="450">Diseño de solución y ADRs.</text>
      <text x="688" y="596">Señales, fortalezas y riesgos.</text>
      <text x="688" y="742">Puntos concretos para explorar.</text>
      <text x="688" y="888">Razonamiento y contexto del candidato.</text>
      <text x="688" y="1034">Criterio informado por la conversación.</text>
    </g>
    <g fill="none" stroke="#91acbd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M924 490 V512 M917 506 L924 514 L931 506"/>
      <path d="M924 636 V658 M917 652 L924 660 L931 652"/>
      <path d="M924 782 V804 M917 798 L924 806 L931 798"/>
      <path d="M924 928 V950 M917 944 L924 952 L931 944"/>
    </g>
    <rect x="32" y="1136" width="1190" height="86" rx="18" fill="#e8eef4"/>
    <text x="627" y="1188" text-anchor="middle" fill="#102238" font-size="27" font-weight="700">El sesgo es más peligroso cuando una inferencia se convierte en decisión.</text>
  </g>
</svg>
